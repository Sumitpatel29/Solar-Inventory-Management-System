<title>Saurasakti Stock Manager</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: dark gradient sidebar + soft working area; cards on a cool grey ground. On phones the sidebar becomes a bottom tab bar. */
/* Layout: macOS-style window. Frosted sidebar on the left, content on Apple grey; phones get a frosted bottom tab bar. */
:root {
  --bg: #f5f5f7;
  --surface: #ffffff;
  --surface-2: #f2f2f5;
  --ink: #1d1d1f;
  --muted: #6e6e73;
  --line: rgba(0,0,0,.09);
  --grid: rgba(0,0,0,.07);
  --accent: #007aff;
  --accent-ink: #ffffff;
  --accent-soft: rgba(0,122,255,.12);
  --side-bg: rgba(236,236,241,.78);
  --side-ink: #1d1d1f;
  --side-muted: #6e6e73;
  --side-hover: rgba(0,0,0,.05);
  --side-line: rgba(0,0,0,.09);
  --sun: #ffb21f;
  --sun-2: #f58a00;
  --sun-soft: rgba(255,159,10,.16);
  --ok: #1f8a3b;
  --ok-soft: rgba(52,199,89,.16);
  --warn: #a35200;
  --warn-soft: rgba(255,159,10,.17);
  --bad: #d3281e;
  --bad-soft: rgba(255,59,48,.12);
  --info: #0a63d6;
  --info-soft: rgba(0,122,255,.11);
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --shadow: 0 0 0 .5px rgba(0,0,0,.05), 0 1px 3px rgba(0,0,0,.05), 0 10px 28px rgba(0,0,0,.04);
  --f-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", system-ui, sans-serif;
  --f-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1c1e; --surface: #2c2c2e; --surface-2: #363638; --ink: #f5f5f7; --muted: #a1a1a8; --line: rgba(255,255,255,.11); --grid: rgba(255,255,255,.08);
    --accent: #0a84ff; --accent-soft: rgba(10,132,255,.22);
    --side-bg: rgba(44,44,46,.74); --side-ink: #f5f5f7; --side-muted: #a1a1a8; --side-hover: rgba(255,255,255,.07); --side-line: rgba(255,255,255,.1);
    --sun-soft: rgba(255,159,10,.2);
    --ok: #32d74b; --ok-soft: rgba(48,209,88,.18); --warn: #ffb340; --warn-soft: rgba(255,159,10,.18); --bad: #ff6961; --bad-soft: rgba(255,69,58,.2);
    --info: #6aaeff; --info-soft: rgba(10,132,255,.22);
    --series-1: #3987e5; --series-2: #d95926;
    --shadow: 0 0 0 .5px rgba(255,255,255,.05), 0 1px 3px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1c1c1e; --surface: #2c2c2e; --surface-2: #363638; --ink: #f5f5f7; --muted: #a1a1a8; --line: rgba(255,255,255,.11); --grid: rgba(255,255,255,.08);
  --accent: #0a84ff; --accent-soft: rgba(10,132,255,.22);
  --side-bg: rgba(44,44,46,.74); --side-ink: #f5f5f7; --side-muted: #a1a1a8; --side-hover: rgba(255,255,255,.07); --side-line: rgba(255,255,255,.1);
  --sun-soft: rgba(255,159,10,.2);
  --ok: #32d74b; --ok-soft: rgba(48,209,88,.18); --warn: #ffb340; --warn-soft: rgba(255,159,10,.18); --bad: #ff6961; --bad-soft: rgba(255,69,58,.2);
  --info: #6aaeff; --info-soft: rgba(10,132,255,.22);
  --series-1: #3987e5; --series-2: #d95926;
  --shadow: 0 0 0 .5px rgba(255,255,255,.05), 0 1px 3px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.25);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.015em; }
h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: -.022em; }
h2 { font-size: 1.05rem; font-weight: 600; }
h3 { font-size: .95rem; font-weight: 600; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent) !important; box-shadow: 0 0 0 3px var(--accent-soft); }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); font-size: .76rem; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: .85rem; }

.app { display: grid; grid-template-columns: 244px 1fr; min-height: 100%; }
.side {
  color: var(--side-ink); background: var(--side-bg);
  -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px);
  border-right: 1px solid var(--side-line);
  padding: 14px 12px 18px; display: flex; flex-direction: column; gap: 18px;
  position: sticky; top: 0; height: 100vh;
}
.lights { display: flex; gap: 8px; padding: 2px 8px 4px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.2); }
.lights i:nth-child(1) { background: #ff5f57; }
.lights i:nth-child(2) { background: #febc2e; }
.lights i:nth-child(3) { background: #28c840; }
.brand { display: flex; gap: 10px; align-items: center; padding: 0 8px; }
.brand-mark { width: 36px; height: 36px; border-radius: 9px; background: linear-gradient(160deg, #ffcf47, #f58a00); display: grid; place-items: center; flex: none; box-shadow: 0 2px 8px rgba(245,138,0,.35), inset 0 0 0 .5px rgba(0,0,0,.15); }
.brand-name { font-weight: 700; font-size: 1rem; color: var(--side-ink); line-height: 1.15; letter-spacing: -.01em; }
.brand-sub { font-size: .76rem; color: var(--side-muted); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a {
  display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px;
  color: var(--side-ink); text-decoration: none; font-weight: 500; font-size: .93rem;
}
.nav a svg { width: 18px; height: 18px; flex: none; color: var(--accent); }
.nav a:hover { background: var(--side-hover); }
.nav a.on { background: var(--accent); color: #fff; }
.nav a.on svg { color: #fff; }
.nav .cta { margin-top: 12px; background: var(--surface); font-weight: 600; box-shadow: 0 0 0 .5px rgba(0,0,0,.14), 0 1px 2px rgba(0,0,0,.1); }
.nav .cta:hover { background: var(--surface); filter: brightness(.98); }
.nav .cta.on { background: var(--accent); color: #fff; }
.side-foot { margin-top: auto; font-size: .78rem; color: var(--side-muted); padding: 0 8px; display: flex; flex-direction: column; gap: 8px; }
.side-foot button { background: var(--surface); border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-weight: 500; }
.side-foot button:hover { filter: brightness(.97); }

.main { min-width: 0; padding-block: 28px 64px; padding-left: max(30px, env(safe-area-inset-left, 0px)); padding-right: max(30px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
.head p { color: var(--muted); margin-top: 4px; }
.demo-pill { display: inline-block; font-family: var(--f-body); font-size: .68rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; background: var(--sun-soft); color: var(--warn); padding: 3px 9px; border-radius: 99px; vertical-align: middle; margin-left: 10px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 8px; cursor: pointer; font-weight: 500; text-decoration: none; white-space: nowrap; box-shadow: 0 .5px 1.5px rgba(0,0,0,.14); }
.btn:hover { filter: brightness(.97); }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); font-weight: 600; box-shadow: 0 .5px 1.5px rgba(0,0,0,.25); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); box-shadow: none; }
.btn.ghost:hover { color: var(--ink); background: var(--surface-2); filter: none; }
.btn.sm { padding: 4px 11px; font-size: .85rem; border-radius: 7px; }
.btn[disabled] { opacity: .4; cursor: not-allowed; filter: none; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
a.link { color: var(--info); font-weight: 500; text-decoration: none; font-size: .88rem; }
a.link:hover { text-decoration: underline; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.card-h .sub { color: var(--muted); font-size: .85rem; font-weight: 400; display: block; margin-top: 1px; font-family: var(--f-body); letter-spacing: 0; }
.card-b { padding: 18px 20px; }
.grid2 { display: grid; grid-template-columns: 1.35fr 1fr; gap: 18px; align-items: start; }
.grid2.even { grid-template-columns: 1fr 1fr; }
.grid2 > * { min-width: 0; }

.ico { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; flex: none; background: #8e8e93; color: #fff; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.12); }
.ico svg { width: 18px; height: 18px; }
.ico.ok { background: linear-gradient(180deg, #4cd964, #2fb457); }
.ico.warn, .ico.sun { background: linear-gradient(180deg, #ffb13b, #ff9500); }
.ico.bad { background: linear-gradient(180deg, #ff6259, #f0372d); }
.ico.info { background: linear-gradient(180deg, #3d9bff, #0a6cf0); }
.ico.plain { background: linear-gradient(180deg, #a5a5ab, #86868b); }

.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.kpi { padding: 18px 20px; display: flex; flex-direction: column; gap: 4px; }
.kpi-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; }
.kpi .lbl { font-size: .84rem; color: var(--muted); font-weight: 500; }
.kpi-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
.kpi .val { font-family: var(--f-display); font-size: 1.75rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; line-height: 1.15; }
.kpi .sub { font-size: .84rem; color: var(--muted); }
.kpi.alert .val { color: var(--bad); }
.spark { flex: none; display: block; }
a.kpi { color: inherit; text-decoration: none; transition: transform .15s, box-shadow .15s; }
a.kpi:hover { transform: translateY(-2px); }
.delta { font-size: .78rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.delta.up { background: var(--ok-soft); color: var(--ok); }
.delta.down { background: var(--bad-soft); color: var(--bad); }

.ins-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.ins { padding: 16px 18px; display: flex; gap: 13px; align-items: flex-start; }
.ins > * { min-width: 0; }
.ins-b { display: flex; flex-direction: column; gap: 4px; }
.ins-b p { font-size: .88rem; color: var(--muted); }
.ins-b a.link { margin-top: 3px; }
.sec-title { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: -6px; }
.sec-title p { color: var(--muted); font-size: .88rem; }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px; border-radius: 99px; font-size: .78rem; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.plain { background: var(--surface-2); color: var(--muted); }

.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: .78rem; color: var(--muted); font-weight: 600; padding: 11px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface-2); }
td { padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: var(--surface-2); }
.pname { font-weight: 600; }

.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.search { flex: 1 1 240px; min-width: 0; padding: 9px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); box-shadow: 0 1px 2px rgba(14,26,51,.04); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 13px; cursor: pointer; font-size: .88rem; font-weight: 500; }
.chip:hover { border-color: var(--muted); }
.chip.on { background: var(--accent); color: #fff; border-color: transparent; }

.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); }
.li.click { cursor: pointer; }
.li.click:hover { background: var(--surface-2); }
.li:last-child { border-bottom: 0; }
.li .grow { flex: 1; min-width: 0; }
.big-n { font-family: var(--f-display); font-weight: 700; font-size: 1.5rem; min-width: 44px; text-align: center; font-variant-numeric: tabular-nums; }
.big-n.zero { color: var(--bad); }

.kits { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 18px; align-items: start; }
.kit-top { padding: 18px 20px; display: flex; gap: 14px; align-items: flex-start; }
.kit-top .grow { flex: 1; min-width: 0; }
.can { text-align: center; padding: 8px 14px; border-radius: 12px; background: var(--surface-2); }
.can .n { font-family: var(--f-display); font-weight: 800; font-size: 1.7rem; line-height: 1; }
.can .t { font-size: .68rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.can.zero .n { color: var(--bad); }
.kit-items { border-top: 1px solid var(--line); }
.kit-items .row { display: grid; grid-template-columns: 1fr 74px 70px 28px; gap: 8px; align-items: center; padding: 8px 20px; border-bottom: 1px solid var(--line); font-size: .9rem; }
.kit-items .row > * { min-width: 0; }
.kit-items .row:last-child { border-bottom: 0; }
.kit-foot { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.qty-in { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); text-align: right; font-variant-numeric: tabular-nums; }
.x { border: 0; background: transparent; color: var(--muted); cursor: pointer; border-radius: 8px; padding: 3px; display: grid; place-items: center; }
.x:hover { color: var(--bad); background: var(--bad-soft); }
.bneck { font-size: .82rem; color: var(--bad); }

.steps { display: flex; gap: 6px; flex-wrap: wrap; font-size: .85rem; }
.steps span { padding: 4px 11px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
.steps b { color: var(--ink); }
.form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.form-grid > * { min-width: 0; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: .82rem; font-weight: 600; color: var(--muted); }
label.f input, label.f select, label.f textarea { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-weight: 400; color: var(--ink); font-size: .95rem; width: 100%; }
.kit-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.kp { text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 13px; padding: 13px 15px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
.kp:hover { border-color: var(--muted); }
.kp.on { border-color: var(--accent); background: var(--accent-soft); }
.kp b { font-family: var(--f-display); font-size: .98rem; }
.lines td { padding: 9px 14px; }
.lines select { padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); max-width: 100%; width: 100%; min-width: 180px; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.stepper button { border: 0; background: var(--surface-2); width: 30px; height: 32px; cursor: pointer; font-weight: 700; font-size: 1rem; }
.stepper button:hover { background: var(--line); }
.stepper input { width: 52px; border: 0; text-align: center; height: 32px; background: var(--surface); font-variant-numeric: tabular-nums; }
.summary { position: sticky; top: 16px; }
.sum-row { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; }
.sum-row.total { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 12px; font-family: var(--f-display); font-weight: 800; font-size: 1.25rem; }
.size-tag { display: flex; align-items: baseline; gap: 6px; font-family: var(--f-display); }
.size-tag .n { font-size: 2.3rem; font-weight: 800; line-height: 1; letter-spacing: -.02em; }
.check-box { border-radius: 12px; padding: 12px 14px; font-size: .9rem; display: flex; flex-direction: column; gap: 4px; }
.check-box.ok { background: var(--ok-soft); color: var(--ok); }
.check-box.bad { background: var(--bad-soft); color: var(--bad); }
.check-box b { font-weight: 700; }
.addline { display: flex; gap: 8px; padding: 14px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.addline select { flex: 1 1 240px; min-width: 0; padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }

.pipe { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.pipe button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px 16px; cursor: pointer; display: flex; flex-direction: column; box-shadow: var(--shadow); }
.pipe button.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.pipe .n { font-family: var(--f-display); font-weight: 800; font-size: 1.6rem; }
.pipe .t { font-size: .84rem; color: var(--muted); font-weight: 500; }
.order { padding: 16px 20px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: center; }
.order:last-child { border-bottom: 0; }
.order .meta { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: .87rem; color: var(--muted); }
.order .who { font-weight: 700; font-size: 1.02rem; }

/* Charts */
.chart { overflow-x: auto; padding: 4px 0 0; }
.chart svg { display: block; width: 100%; min-width: 440px; height: auto; overflow: visible; }
.gl { stroke: var(--grid); stroke-width: 1; }
.ax { fill: var(--muted); font-size: 11px; font-family: var(--f-body); }
.ax.st { fill: var(--ink); font-weight: 700; }
.vl { fill: var(--ink); font-size: 11px; font-weight: 700; font-family: var(--f-body); font-variant-numeric: tabular-nums; }
.col .h { fill: transparent; cursor: crosshair; }
.col:hover .h, .col:focus-within .h { fill: var(--surface-2); }
.col .xh, .col .hd { opacity: 0; }
.col:hover .xh, .col:focus-within .xh, .col:hover .hd, .col:focus-within .hd { opacity: 1; }
.xh { stroke: var(--muted); stroke-dasharray: 3 3; }
.legend { display: flex; gap: 6px 18px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); }
.lg { display: inline-flex; align-items: center; gap: 7px; }
.lg i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; flex: none; }
.dn { font-family: var(--f-display); font-weight: 800; font-size: 26px; fill: var(--ink); }
.dl { font-size: 10px; fill: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.health { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
.health svg { width: 160px; height: 160px; flex: none; }
.health .legend { flex-direction: column; gap: 12px; flex: 1; min-width: 150px; font-size: .92rem; color: var(--ink); }
.health .lg { justify-content: space-between; width: 100%; gap: 10px; }
.health .lg span:first-child { display: inline-flex; align-items: center; gap: 8px; }
.hb { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; min-width: 40px; }
.hb i { display: block; height: 100%; border-radius: 0 4px 4px 0; }

  }

  --fill: rgba(120,120,128,.3); --fill-2: rgba(120,120,128,.16);

  document.addEventListener('focusin', ev => { const el = ev.target.closest && ev.target.closest('[data-tip]'); if (el) { const r = el.getBoundingClientRect(); showTip(el, r.left + r.width / 2, r.top + 24); } });
  document.addEventListener('focusout', () => { tipEl.hidden = true; });
  window.addEventListener('scroll', () => { tipEl.hidden = true; }, true);

  /* ---------- Cards ---------- */
  const delta = (c, p, goodUp) => {
    if (!p) return '';
    const ch = (c - p) / p * 100; if (!isFinite(ch)) return '';
    const cls = goodUp === null || Math.abs(ch) < .5 ? '' : ((ch >= 0) === goodUp ? 'up' : 'down');
    return '<span class="delta ' + cls + '" title="Compared with the previous 30 days">' + (ch >= 0 ? '▲ ' : '▼ ') + Math.abs(ch).toFixed(Math.abs(ch) < 10 ? 1 : 0) + '%</span>';
  };
  const kpi = k => {
    const tag = k.href ? 'a' : 'div';
    return '<' + tag + ' class="card kpi' + (k.alert ? ' alert' : '') + '"' + (k.href ? ' href="' + k.href + '"' : '') + '><div class="kpi-top"><span class="ico sm ' + k.tone + '">' + ICON[k.icon] + '</span><span class="lbl">' + k.label + '</span>' + (k.delta || '') + '</div>' +
      '<div class="kpi-row"><span class="val num">' + k.value + '</span>' + (k.spark ? spark(k.spark, 'var(--series-1)') : '') + '</div><span class="sub">' + k.sub + '</span></' + tag + '>';
  };
  const insCards = list => '<div class="ins-grid">' + list.map(i => '<article class="card ins"><span class="ico ' + i.tone + '">' + ICON[i.icon] + '</span><div class="ins-b"><h3>' + i.title + '</h3><p>' + i.text + '</p>' +
    (i.href ? '<a class="link" href="' + i.href + '">' + i.cta + ' ›</a>' : '') + '</div></article>').join('') + '</div>';

  function insights() {
    const out = [], ser = series(), cur = ser[ser.length - 1], prev = ser[ser.length - 2];
    S.projects.filter(o => o.status === 'quote').forEach(o => {
      const sh = shortages(o.items, o.id);
      if (sh.length) out.push({ tone: 'bad', icon: 'alert', title: esc(o.customer) + ' is waiting on stock', text: inr(billed(o)) + ' quotation ' + o.id + ' cannot be reserved yet. ' + sh.map(s => esc(part(s.pid).name) + ' is short by ' + qn(s.short)).join(', ') + '.', href: '#buy', cta: 'Open purchase list' });
    });
    const crit = S.parts.filter(p => p.pm > 0 && coverDays(p) < 21).sort((a, b) => coverDays(a) - coverDays(b));
    if (crit.length) out.push({ tone: 'warn', icon: 'clock', title: crit.length + ' part' + (crit.length > 1 ? 's' : '') + ' will run out within 3 weeks', text: crit.slice(0, 3).map(p => esc(p.name) + ' (' + Math.round(coverDays(p)) + ' days)').join(', ') + '. Based on your usual monthly usage.', href: '#buy', cta: 'Plan purchase' });
    const slow = S.parts.filter(p => p.stock > 0 && idleDays(p) >= 60);
    if (slow.length) out.push({ tone: 'info', icon: 'coin', title: inr(sum(slow.map(p => p.stock * p.cost))) + ' is tied up in slow-moving parts', text: slow.map(p => esc(p.name) + ' (' + idleDays(p) + ' days idle)').join(', ') + '. Offer these in the next quotation.', href: '#reports', cta: 'See slow stock' });
    if (prev.rev > 0) {
      const ch = (cur.rev - prev.rev) / prev.rev * 100;
      out.push({ tone: ch >= 0 ? 'ok' : 'warn', icon: 'trend', title: 'Sales are ' + (ch >= 0 ? 'up ' : 'down ') + Math.abs(Math.round(ch)) + '% on the previous 30 days', text: inr(cur.rev) + ' billed across ' + cur.n + ' system' + (cur.n === 1 ? '' : 's') + ', compared with ' + inr(prev.rev) + '.', href: '#orders', cta: 'View orders' });
    }
    const fast = S.parts.filter(p => p.pm > 0).sort((a, b) => b.pm * b.price - a.pm * a.price)[0];
    if (fast) out.push({ tone: 'ok', icon: 'star', title: 'Best seller: ' + esc(fast.name), text: 'About ' + qn(fast.pm) + ' ' + fast.unit + ' a month, worth ' + inr(fast.pm * fast.price) + ' in sales. Current stock lasts ' + coverText(coverDays(fast)) + '.', href: '#stock', cta: 'Open stock' });
    const km = S.kits.filter(k => k.items.length).map(k => ({ k, m: priceOf(k.items) - costOf(k.items), pct: (priceOf(k.items) - costOf(k.items)) / priceOf(k.items) })).sort((a, b) => b.m - a.m);
    if (km.length > 1) out.push({ tone: 'ok', icon: 'coin', title: esc(km[0].k.name) + ' earns the most per system', text: inr(km[0].m) + ' parts margin (' + Math.round(km[0].pct * 100) + '%) on each one. ' + esc(km[km.length - 1].k.name) + ' earns the least at ' + inr(km[km.length - 1].m) + '.', href: '#kits', cta: 'Open kits' });
    const rank = { bad: 0, warn: 1, info: 2, ok: 3 };
    return out.map((x, i) => [x, i]).sort((a, b) => rank[a[0].tone] - rank[b[0].tone] || a[1] - b[1]).map(x => x[0]);
  }

  /* ---------- Home ---------- */
  V.home = () => {
    const ser = series(), cur = ser[ser.length - 1], prev = ser[ser.length - 2], labels = periodLabels(), n = ser.length;
    const open = S.projects.filter(p => p.status === 'quote' || p.status === 'reserved');
    const low = S.parts.filter(p => stockState(p) !== 'ok'), outN = S.parts.filter(p => stockState(p) === 'bad').length;
    const builds = S.kits.map(k => ({ k, ...canBuild(k.items) })), ready = sum(builds.map(b => b.n));
    const recent = S.moves.slice().sort((a, b) => b.date.localeCompare(a.date)).slice(0, 6);
    const soon = S.parts.filter(p => p.pm > 0).sort((a, b) => coverDays(a) - coverDays(b)).slice(0, 4);
    const runway = '<div style="border-top:1px solid var(--line);padding:12px 0 8px"><div class="small muted" style="padding:0 20px 4px;font-weight:600">Running out soonest</div>' +
      soon.map(p => '<div class="hrow h-link" data-act="part" data-id="' + p.id + '"><span class="nm">' + esc(p.name) + '</span>' + hbar(coverDays(p) / 120 * 100, coverDays(p) < 21 ? 'var(--bad)' : coverDays(p) < 45 ? 'var(--warn)' : 'var(--series-1)') + '<span class="v">' + pill(coverTone(coverDays(p)), coverText(coverDays(p))) + '</span></div>').join('') + '</div>';
    const hc ={ ok: 0, warn: 0, bad: 0 }; S.parts.forEach(p => hc[stockState(p)]++);
    const hItems = [{ label: 'In stock', v: hc.ok, color: 'var(--ok)', fmt: hc.ok + ' parts' }, { label: 'Running low', v: hc.warn, color: 'var(--warn)', fmt: hc.warn + ' parts' }, { label: 'Out of stock', v: hc.bad, color: 'var(--bad)', fmt: hc.bad + ' parts' }];
    return '<div class="head"><div><h1>Good ' + (today.getHours() < 12 ? 'morning' : today.getHours() < 17 ? 'afternoon' : 'evening') + '<span class="demo-pill">Demo</span></h1>' +
      '<p>Here is what is in the godown and what you can sell today.</p></div>' +
      '<div class="btns"><button class="btn ghost mob-reset" data-act="reset">Reset sample data</button><button class="btn" data-act="stockin">+ Receive stock</button><a class="btn primary" href="#new-order" data-act="usekit" data-id="k1">+ New order</a></div></div>' +
      '<div class="kpis">' +
      kpi({ href: '#reports', icon: 'stock', tone: 'info', label: 'Stock value', value: inr(stockValue()), sub: 'at purchase price', delta: delta(stockValue(), prev.sv, null), spark: ser.map(s => s.sv) }) +
      kpi({ href: '#reports', icon: 'reports', tone: 'ok', label: 'Sales, last 30 days', value: inr(cur.rev), sub: cur.n + ' system' + (cur.n === 1 ? '' : 's') + ' · ' + cur.kw.toFixed(1) + ' kWp', delta: delta(cur.rev, prev.rev, true), spark: ser.map(s => s.rev) }) +
      kpi({ href: '#orders', icon: 'orders', tone: 'sun', label: 'Open pipeline', value: inr(sum(open.map(billed))), sub: open.length + ' order' + (open.length === 1 ? '' : 's') + ' waiting' }) +
      kpi({ href: '#buy', icon: 'alert', tone: low.length ? 'bad' : 'ok', alert: low.length > 0, label: 'Parts needing attention', value: low.length, sub: outN + ' out of stock · ' + (low.length - outN) + ' running low' }) +
      '</div>' +
      '<div class="sec-title"><h2>Insights for today</h2><a class="link" href="#reports">All insights ›</a></div>' + insCards(insights().slice(0, 4)) +
      '<div class="grid2"><section class="card"><div class="card-h"><h2>Sales and margin<span class="sub">Last ' + n + ' periods of 30 days</span></h2>' + legend([['Billed', 'var(--series-1)'], ['Parts margin', 'var(--series-2)']]) + '</div>' +
      '<div class="card-b"><div class="chart">' + barChart(ser, labels) + '</div>' +
      tableView(['Period', 'Billed', 'Parts margin', 'Systems'], ser.map((s, i) => [periodTitle(i, n), inr(s.rev), inr(s.margin), s.n])) + '</div></section>' +
      '<section class="card"><div class="card-h"><h2>Stock health<span class="sub">All ' + S.parts.length + ' parts, after reservations</span></h2></div><div class="card-b"><div class="health">' +
      donut(hItems, S.parts.length, 'parts') + '<div class="legend">' + hItems.map(i => '<span class="lg"><span><i style="background:' + i.color + '"></i>' + i.label + '</span><b class="num">' + i.v + '</b></span>').join('') + '</div></div></div>' + runway + '</section></div>' +
      '<div class="grid2">' +
      '<section class="card"><div class="card-h"><h2>What can I build right now?<span class="sub">' + ready + ' complete system' + (ready === 1 ? '' : 's') + ' ready in the godown</span></h2><a class="btn ghost sm" href="#kits">All kits</a></div><div class="list">' +
      builds.map(b => '<div class="li"><div class="big-n' + (b.n ? '' : ' zero') + '">' + b.n + '</div><div class="grow"><div class="pname">' + esc(b.k.name) + '</div>' +
        (b.by ? '<div class="small ' + (b.n ? 'muted' : 'bneck') + '">' + (b.n ? 'Limited by ' : 'Blocked by ') + esc(part(b.by).name) + ' (' + qn(Math.max(0, avail(b.by))) + ' ' + part(b.by).unit + ' free)</div>' : '') +
        '</div><a class="btn sm" href="#new-order" data-act="usekit" data-id="' + b.k.id + '">Sell</a></div>').join('') +
      '</div></section>' +
      '<section class="card"><div class="card-h"><h2>Needs attention</h2><a class="btn ghost sm" href="#buy">Purchase list</a></div><div class="list">' +
      (low.length ? low.map(p => '<div class="li click" data-act="part" data-id="' + p.id + '"><div class="grow"><div class="pname">' + esc(p.name) + '</div><div class="small muted">' + qn(Math.max(0, avail(p.id))) + ' ' + p.unit + ' free · minimum ' + qn(p.min) + '</div></div>' + pill(stockState(p), stateLabel[stockState(p)]) + '</div>').join('')
        : '<div class="empty">Everything is above minimum stock.</div>') +
      '</div></section></div>' +
      '<section class="card"><div class="card-h"><h2>Recent stock movement</h2><a class="btn ghost sm" href="#reports">Full register</a></div>' + movesTable(recent) + '</section>';
  };

  function movesTable(list) {
    const T = { in: ['ok', 'Received'], out: ['info', 'Dispatched'], return: ['plain', 'Returned'], adjust: ['bad', 'Adjusted'] };
    if (!list.length) return '<div class="empty">No movement yet.</div>';
    return '<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Part</th><th>Type</th><th class="r">Qty</th><th>Reference</th></tr></thead><tbody>' +
      list.map(m => { const p = part(m.pid); return '<tr><td class="num">' + fmtDate(m.date) + '</td><td>' + esc(p.name) + '</td><td>' + pill(T[m.type][0], T[m.type][1]) + '</td><td class="r num">' + (m.qty > 0 ? '+' : '') + qn(m.qty) + ' ' + p.unit + '</td><td class="muted small">' + esc(m.ref) + '</td></tr>'; }).join('') +
      '</tbody></table></div>';
  }

  /* ---------- Find parts: search + filters, shared by the Stock page and the part picker ---------- */
  ICON.search = svgI('<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>');
  const fold = s => String(s == null ? '' : s).toLowerCase();
  const tokens = q => fold(q).split(/[\s,]+/).filter(Boolean);
  const hay = p => fold([p.brand, p.name, p.sku, CATS[p.cat], p.unit, p.w ? p.w + 'wp' : ''].join(' '));
  const hl = (txt, toks) => {
    if (!toks.length) return esc(txt);
    const re = new RegExp('(' + toks.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'ig');
    return String(txt).split(re).map((s, i) => i % 2 ? '<mark>' + esc(s) + '</mark>' : esc(s)).join('');
  };
  const newFilter = extra => Object.assign({ q: '', cat: 'all', brands: [], status: 'all', more: false, open: false }, extra);
  let stockFilter = newFilter({ sort: 'default' });
  let pk = null;
  function matchPart(p, f, skip) {
    const h = hay(p);
    if (!tokens(f.q).every(t => h.includes(t))) return false;
    if (skip !== 'cat' && f.cat !== 'all' && p.cat !== f.cat) return false;
    if (skip !== 'brand' && f.brands.length && !f.brands.includes(p.brand)) return false;
    if (skip !== 'status' && f.status !== 'all' && stockState(p) !== f.status) return false;
    return true;
  }
  const cmp = (x, y) => x === y ? 0 : x < y ? -1 : 1;
  const catIx = p => Object.keys(CATS).indexOf(p.cat);
  const SORTS = {
    default: ['Category, then brand', (a, b) => catIx(a) - catIx(b) || a.brand.localeCompare(b.brand) || a.name.localeCompare(b.name)],
    name: ['Name, A to Z', (a, b) => a.name.localeCompare(b.name)],
    urgent: ['Most urgent first', (a, b) => cmp(avail(a.id) / Math.max(a.min, 1), avail(b.id) / Math.max(b.min, 1))],
    cover: ['Days left, soonest first', (a, b) => cmp(coverDays(a), coverDays(b))],
    value: ['Stock value, highest first', (a, b) => b.stock * b.cost - a.stock * a.cost]
  };
  function activeFilters(f) {
    const a = [];
    if (f.q.trim()) a.push(['q', '', '"' + f.q.trim() + '"']);
    if (f.cat !== 'all') a.push(['cat', '', CATS[f.cat]]);
    f.brands.forEach(b => a.push(['brand', b, b]));
    if (f.status !== 'all') a.push(['status', '', stateLabel[f.status]]);
    return a;
  }
  function filterPanel(key, f) {
    const catN = {}, brN = {}, stN = { ok: 0, warn: 0, bad: 0 };
    S.parts.forEach(p => {
      if (matchPart(p, f, 'cat')) catN[p.cat] = (catN[p.cat] || 0) + 1;
      if (matchPart(p, f, 'brand')) brN[p.brand] = (brN[p.brand] || 0) + 1;
      if (matchPart(p, f, 'status')) stN[stockState(p)]++;
    });
    const chip = (act, id, label, n, on, extra) => '<button type="button" class="chip' + (on ? ' on' : '') + (!n && !on ? ' dim' : '') + '" data-act="' + act + '" data-f="' + key + '" data-id="' + esc(id) + '" aria-pressed="' + on + '">' + (extra || '') + esc(label) + ' <span class="cnt">' + n + '</span></button>';
    const brands = [...new Set(S.parts.map(p => p.brand))].filter(b => brN[b] || f.brands.includes(b)).sort((a, b) => (brN[b] || 0) - (brN[a] || 0) || a.localeCompare(b));
    const shown = f.more ? brands : brands.filter((b, i) => i < 8 || f.brands.includes(b));
    const act = activeFilters(f), total = sum(Object.values(catN));
    const more = brands.length > shown.length ? '<button type="button" class="chip more" data-act="fmore" data-f="' + key + '">+ ' + (brands.length - shown.length) + ' more</button>'
      : (f.more && brands.length > 8 ? '<button type="button" class="chip more" data-act="fmore" data-f="' + key + '">Show fewer</button>' : '');
    return '<div class="fsum"><button type="button" class="btn sm ftoggle" data-act="ftoggle" data-f="' + key + '" aria-expanded="' + f.open + '">Filters' + (act.length ? ' · ' + act.length : '') + '</button>' +
      (act.length ? '<div class="afil">' + act.map(a => '<button type="button" class="afi" data-act="frem" data-f="' + key + '" data-k="' + a[0] + '" data-id="' + esc(a[1]) + '" aria-label="Remove filter ' + esc(a[2]) + '">' + esc(a[2]) + ICON.x + '</button>').join('') + '</div><button type="button" class="btn ghost sm" data-act="fclear" data-f="' + key + '">Clear all</button>'
        : '<span class="muted small">Showing every part. Pick a brand or category to narrow it down.</span>') + '</div>' +
      '<div class="frows"><div class="frow"><span class="fl">Category</span><div class="chips">' + chip('fcat', 'all', 'All', total, f.cat === 'all') + Object.entries(CATS).map(([k, v]) => chip('fcat', k, v, catN[k] || 0, f.cat === k)).join('') + '</div></div>' +
      '<div class="frow"><span class="fl">Brand</span><div class="chips">' + (shown.length ? shown.map(b => chip('fbrand', b, b, brN[b] || 0, f.brands.includes(b))).join('') : '<span class="muted small">No brand matches</span>') + more + '</div></div>' +
      (key === 'stock' ? '<div class="frow"><span class="fl">Availability</span><div class="chips seg">' + chip('fstatus', 'all', 'All', S.parts.filter(p => matchPart(p, f, 'status')).length, f.status === 'all') +
        ['ok', 'warn', 'bad'].map(s => chip('fstatus', s, stateLabel[s], stN[s], f.status === s, '<i class="dot ' + s + '"></i>')).join('') + '</div></div>' : '') + '</div>';
  }
  function filterAct(a, el) {
    const key = el.dataset.f, f = key === 'pk' ? pk : stockFilter, id = el.dataset.id;
    if (!f) return;
    if (a === 'fcat') f.cat = f.cat === id ? 'all' : id;
    if (a === 'fbrand') f.brands = f.brands.includes(id) ? f.brands.filter(b => b !== id) : f.brands.concat(id);
    if (a === 'fstatus') f.status = f.status === id ? 'all' : id;
    if (a === 'fclear') Object.assign(f, { q: '', cat: 'all', brands: [], status: 'all' });
    if (a === 'fmore') f.more = !f.more;
    if (a === 'ftoggle') f.open = !f.open;
    if (a === 'frem') { const k = el.dataset.k; if (k === 'q') f.q = ''; else if (k === 'cat') f.cat = 'all'; else if (k === 'status') f.status = 'all'; else f.brands = f.brands.filter(b => b !== id); }
    refreshFilter(key);
  }
  function refreshFilter(key) {
    if (key === 'pk') { const q = $('#pk-q'); if (q && q.value !== pk.q) q.value = pk.q; $('#pk-res').innerHTML = pickerRes(); return; }
    const q = $('#q'); if (q && q.value !== stockFilter.q) q.value = stockFilter.q;
    const box = $('#stock-filters'); box.innerHTML = filterPanel('stock', stockFilter); box.classList.toggle('open', stockFilter.open);
    $('#stock-table').innerHTML = stockTable();
  }

  V.stock = () => '<div class="head"><div><h1>Stock</h1><p>Find any part by brand, category or code. "Free" means not yet promised to any customer.</p></div>' +
    '<div class="btns"><button class="btn" data-act="stockcsv">Export CSV</button><button class="btn" data-act="newpart">+ New part</button><button class="btn primary" data-act="stockin">+ Receive stock</button></div></div>' +
    '<div class="searchbar"><span class="si">' + ICON.search + '</span><input class="search" id="q" type="search" autocomplete="off" placeholder="Search brand, part or code. Try: waaree 540, inverter 5 kw, mc4" value="' + esc(stockFilter.q) + '" aria-label="Search parts"><kbd class="kbd" aria-hidden="true">/</kbd></div>' +
    '<section class="card filters' + (stockFilter.open ? ' open' : '') + '" id="stock-filters">' + filterPanel('stock', stockFilter) + '</section>' +
    '<section class="card" id="stock-table">' + stockTable() + '</section>';

  function stockTable() {
    const f = stockFilter, toks = tokens(f.q), rows = S.parts.filter(p => matchPart(p, f)).sort(SORTS[f.sort][1]);
    const head = '<div class="card-h"><span><b class="num">' + rows.length + '</b> <span class="muted">of ' + S.parts.length + ' parts</span></span><label class="sortl"><span class="muted small">Sort by</span><select id="st-sort" data-act="fsort" aria-label="Sort parts">' +
      Object.entries(SORTS).map(([k, v]) => '<option value="' + k + '"' + (f.sort === k ? ' selected' : '') + '>' + v[0] + '</option>').join('') + '</select></label></div>';
    if (!rows.length) {
      const act = activeFilters(f);
      return head + '<div class="empty"><b>No part matches.</b><div class="small" style="margin:6px 0 14px">Check the spelling, or remove a filter.</div><div class="btns" style="justify-content:center">' +
        act.map(a => '<button type="button" class="afi" data-act="frem" data-f="stock" data-k="' + a[0] + '" data-id="' + esc(a[1]) + '">' + esc(a[2]) + ICON.x + '</button>').join('') +
        '<button type="button" class="btn sm" data-act="fclear" data-f="stock">Clear all</button><button type="button" class="btn sm primary" data-act="newpart">+ Add as new part</button></div></div>';
    }
    return head + '<div class="tbl-wrap"><table><thead><tr><th>Part</th><th>Brand</th><th class="r">In godown</th><th class="r">Reserved</th><th class="r">Free</th><th class="r">Lasts</th><th class="r">Buy price</th><th class="r">Sell price</th><th>Status</th></tr></thead><tbody>' +
      rows.map(p => { const r = reserved(p.id), st = stockState(p); return '<tr class="click" data-act="part" data-id="' + p.id + '"><td><div class="pname">' + hl(p.name, toks) + '</div><div class="mono">' + hl(p.sku, toks) + ' · ' + CATS[p.cat] + '</div></td><td>' + hl(p.brand, toks) + '</td>' +
        '<td class="r num">' + qn(p.stock) + ' ' + p.unit + '</td><td class="r num">' + (r ? qn(r) : '<span class="muted">0</span>') + '</td><td class="r num"><b>' + qn(p.stock - r) + '</b></td><td class="r">' + coverPill(p) + '</td>' +
        '<td class="r num">' + inr(p.cost) + '</td><td class="r num">' + inr(p.price) + '</td><td>' + pill(st, stateLabel[st]) + '</td></tr>'; }).join('') +
      '</tbody></table></div>';
  }

  /* Part picker: search + brand and category filters for adding parts to an order or a kit */
  function openPicker(title, taken, onPick) {
    pk = newFilter({ taken, onPick, added: [] });
    modal(title, '<div class="searchbar"><span class="si">' + ICON.search + '</span><input class="search" id="pk-q" type="search" autocomplete="off" placeholder="Search brand, part or code" aria-label="Search parts"></div>' +
      '<div id="pk-res">' + pickerRes() + '</div><p class="small muted">Press Enter to add the top result. Add as many parts as you need, then press Done.</p>', [{ label: 'Done', cls: 'primary', fn: closeModal }], true);
  }

      '</div>' +

      tableView(['Period', 'Stock value', 'Bought in period'], ser.map((s, i) => [svTitles[i], inr(s.sv), inr(s.buy)])) + '</div></section>' +

  function exportText() {
    if (exportKind === 'stock') return 'Item Name,Part Code,Stock Group,Unit,Closing Qty,Rate,Value\n' +
      S.parts.map(p => ['"' + p.name + '"', p.sku, CATS[p.cat], p.unit, p.stock, p.cost, p.stock * p.cost].join(',')).join('\n');

      S.projects.filter(p => p.status === 'dispatched' || p.status === 'installed').flatMap(o => o.items.map(i => { const p = part(i.pid); return [o.id, o.date, '"' + o.customer + '"', '"' + p.name + '"', p.sku, i.qty, p.unit, p.price, i.qty * p.price].join(','); })).join('\n');

  /* ---------- Actions ---------- */
  function partDetail(id) {
    const p = part(id), r = reserved(id), hist = S.moves.filter(m => m.pid === id).sort((a, b) => b.date.localeCompare(a.date));
    const usedIn = S.kits.filter(k => k.items.some(i => i.pid === id)).map(k => esc(k.name)).join(', ') || 'No kit';
    const holders = S.projects.filter(o => o.status === 'reserved' && o.items.some(i => i.pid === id));
    modal(p.name,
      '<div class="mono">' + esc(p.brand) + ' · ' + esc(p.sku) + ' · ' + CATS[p.cat] + '</div>' +
      '<div class="kpis" style="grid-template-columns:repeat(3,1fr)"><div class="kpi card" style="box-shadow:none"><span class="lbl">In godown</span><span class="val">' + qn(p.stock) + '</span><span class="sub">' + p.unit + '</span></div>' +
      '<div class="kpi card" style="box-shadow:none"><span class="lbl">Reserved</span><span class="val">' + qn(r) + '</span><span class="sub">' + (holders.map(h => esc(h.customer)).join(', ') || 'none') + '</span></div>' +
      '<div class="kpi card" style="box-shadow:none"><span class="lbl">Free</span><span class="val">' + qn(p.stock - r) + '</span><span class="sub">minimum ' + qn(p.min) + '</span></div></div>' +

      '<h3>History</h3><div class="card" style="box-shadow:none">' + movesTable(hist) + '</div>',
      [{ label: 'Correct stock count', fn: () => adjustModal(id) }, { label: 'Receive stock', fn: () => stockIn(id) }, { label: 'Save changes', cls: 'primary', fn: () => {
        p.min = Math.max(0, +$('#pd-min').value || 0); p.cost = Math.max(0, +$('#pd-cost').value || 0); p.price = Math.max(0, +$('#pd-price').value || 0);
        save(); closeModal(); render(); toast('Saved ' + p.name);
      } }], true);
  }
  function stockIn(pid, q) {
    modal('Receive stock',
      '<label class="f">Find part<input id="si-find" type="search" autocomplete="off" placeholder="Type a brand or name, e.g. exide"></label><label class="f">Part<select id="si-part">' + partOptions(pid || '') + '</select></label>' +
      '<div class="form-grid" style="grid-template-columns:1fr 1fr"><label class="f">Quantity received<input id="si-qty" type="number" min="1" value="' + (q || '') + '" placeholder="e.g. 20"></label><label class="f">Supplier bill no.<input id="si-inv" placeholder="e.g. WE/2310"></label></div>' +
      '<label class="f">Supplier<input id="si-sup" placeholder="e.g. Waaree Energies"></label>',
      [{ label: 'Cancel', cls: 'ghost', fn: closeModal }, { label: 'Add to stock', cls: 'primary', fn: () => {
        const id = $('#si-part').value, n = Math.floor(+$('#si-qty').value);
        if (!part(id)) { toast('Choose a part first'); return; }

        notify('stock', 'Godown received ' + qn(n) + ' × ' + p.name, 'Added to stock. ' + qn(avail(p.id)) + ' ' + p.unit + ' now free.', '#stock', LOG);
        save(); closeModal(); render(); toast('Added ' + qn(n) + ' ' + p.unit + ' ' + p.name);
      } }]);
  }
  function adjustModal(pid) {
    const p = part(pid);
    modal('Correct stock count',
      '<p>' + esc(p.name) + '. System says <b>' + qn(p.stock) + ' ' + p.unit + '</b>.</p>' +
      '<div class="form-grid" style="grid-template-columns:1fr 1fr"><label class="f">Actual count in godown<input id="ad-n" type="number" min="0" value="' + p.stock + '"></label><label class="f">Reason<select id="ad-r"><option>Physical count</option><option>Damaged</option><option>Lost / stolen</option><option>Used for demo / service</option></select></label></div>',
      [{ label: 'Cancel', cls: 'ghost', fn: () => partDetail(pid) }, { label: 'Save count', cls: 'primary', fn: () => {
        const n = Math.max(0, Math.floor(+$('#ad-n').value || 0)), d = n - p.stock;

      } }]);

      '<div class="form-grid"><label class="f">Category<select id="np-cat">' + Object.entries(CATS).map(([k, v]) => '<option value="' + k + '">' + v + '</option>').join('') + '</select></label>' +
      '<label class="f">Unit<select id="np-unit"><option>pcs</option><option>m</option><option>set</option><option>pair</option><option>pack</option></select></label>' +
      '<label class="f">Panel watts (if panel)<input id="np-w" type="number" min="0" placeholder="e.g. 550"></label>' +

  function viewOrder(id) {

      '<p class="muted">' + esc(o.place) + (o.phone ? ' · ' + esc(o.phone) : '') + ' · ' + kwOf(o.items).toFixed(2) + ' kWp</p>' +
      '<div class="card" style="box-shadow:none"><div class="tbl-wrap"><table><thead><tr><th>Part</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Amount</th></tr></thead><tbody>' +
      o.items.map(i => { const p = part(i.pid); return '<tr><td>' + esc(p.name) + '</td><td class="r num">' + qn(i.qty) + ' ' + p.unit + '</td><td class="r num">' + inr(p.price) + '</td><td class="r num">' + inr(p.price * i.qty) + '</td></tr>'; }).join('') +
      '<tr><td>Installation & labour</td><td></td><td></td><td class="r num">' + inr(o.labour || 0) + '</td></tr>' +
      '<tr><td><b>Total</b></td><td></td><td></td><td class="r num"><b>' + inr(priceOf(o.items) + Number(o.labour || 0)) + '</b></td></tr></tbody></table></div></div>',
      [{ label: 'Print quotation', fn: () => window.print() }, { label: 'Close', cls: 'primary', fn: closeModal }], true);
  }
  function returnModal(id) {
    const o = S.projects.find(p => p.id === id);
    modal('Return leftover from site',
      '<p class="muted">Enter what came back from ' + esc(o.customer) + '\'s site. It goes back into the godown.</p>' +
      '<div class="card" style="box-shadow:none"><div class="tbl-wrap"><table><thead><tr><th>Part</th><th class="r">Sent</th><th class="r">Returned</th></tr></thead><tbody>' +
      o.items.map((i, ix) => { const p = part(i.pid); return '<tr><td>' + esc(p.name) + '</td><td class="r num">' + qn(i.qty) + ' ' + p.unit + '</td><td class="r"><input class="qty-in" style="width:80px" type="number" min="0" max="' + i.qty + '" id="rt-' + ix + '" value="' + (p.cat === 'cable' && ix < 3 ? Math.min(i.qty, 4) : 0) + '" aria-label="Returned ' + esc(p.name) + '"></td></tr>'; }).join('') +
      '</tbody></table></div></div><p class="note">Cable is usually cut at site, so some metres often come back.</p>',
      [{ label: 'Cancel', cls: 'ghost', fn: closeModal }, { label: 'Add back to stock', cls: 'primary', fn: () => {
        let n = 0;
        o.items.forEach((i, ix) => { const q = Math.min(i.qty, Math.max(0, Math.floor(+$('#rt-' + ix).value || 0))); if (q) {
          part(i.pid).stock += q; n++;
          S.moves.push({ date: daysAgo(0), pid: i.pid, qty: q, type: 'return', ref: o.id + ' leftover from site' });
          const ex = o.returns.find(r => r.pid === i.pid); if (ex) ex.qty += q; else o.returns.push({ pid: i.pid, qty: q });
        } });
        save(); closeModal(); render(); toast(n ? n + ' item' + (n > 1 ? 's' : '') + ' returned to godown' : 'Nothing returned');
      } }], true);
  }
  function confirmBox(title, text, label, fn) {
    modal(title, '<p>' + text + '</p>', [{ label: 'Cancel', cls: 'ghost', fn: closeModal }, { label, cls: 'primary', fn: () => { fn(); closeModal(); render(); } }]);
  }

  function act(el, ev) {
    const a = el.dataset.act, id = el.dataset.id;
    const o = id && S.projects.find(p => p.id === id);
    switch (a) {
      case 'close': closeModal(); break;
      case 'nbell': case 'nread': case 'nclear': case 'nset': case 'nback': case 'ntab': case 'ntest': case 'nopen': notifAct(a, el); break;
      case 'scrim': if (ev.target === el) closeModal(); break;
      case 'mact': { const f = modalActions[+el.dataset.i]; if (f) f.fn(); break; }
      case 'reset': confirmBox('Reset sample data?', 'This removes every change made in this demo and loads the original sample data.', 'Reset', () => { S = seed(); initState(); draft = null; save(); toast('Sample data restored'); }); break;
      case 'part': partDetail(id); break;
      case 'stockin': stockIn(id, el.dataset.q); break;
      case 'newpart': newPart(); break;
      /* stock filters are handled above */
      case 'usekit': draft = newDraft(id); if (route() === 'new-order') { ev.preventDefault(); render(); } break;
      case 'kitdel': { const k = S.kits.find(x => x.id === el.dataset.k); k.items.splice(+el.dataset.i, 1); save(); render(); break; }
      case 'kitpick': { const k = S.kits.find(x => x.id === el.dataset.k); openPicker('Add parts to ' + k.name, pid => k.items.some(i => i.pid === pid), pid => { k.items.push({ pid, qty: 1 }); save(); render(); }); break; }
      case 'newkit':
        modal('New system kit', '<label class="f">Kit name<input id="nk-name" placeholder="e.g. 2 kW On-grid"></label><label class="f">Short note<input id="nk-note" placeholder="Who is it for?"></label><p class="note">You can add parts to it right after.</p>',
          [{ label: 'Cancel', cls: 'ghost', fn: closeModal }, { label: 'Create kit', cls: 'primary', fn: () => {
            const name = $('#nk-name').value.trim(); if (!name) { toast('Give the kit a name'); return; }
            S.kits.push({ id: 'k' + Date.now(), name, note: $('#nk-note').value.trim(), items: [] }); save(); closeModal(); render(); toast('Kit created. Add its parts below.');
          } }]);
        break;
      case 'pickkit': { const kid = id || null; const keep = draft.id; Object.assign(draft, { kitId: kid, items: kid ? S.kits.find(k => k.id === kid).items.map(i => ({ ...i })) : [] }); if (!keep && kid && !draft.labour) draft.labour = 15000; render(); break; }
      case 'step': { const it = draft.items[+el.dataset.i]; it.qty = Math.max(1, it.qty + +el.dataset.d); refreshDraft(true); break; }
      case 'ldel': draft.items.splice(+el.dataset.i, 1); refreshDraft(true); break;
      case 'lpick': openPicker('Add parts to this order', pid => draft.items.some(i => i.pid === pid), pid => { draft.items.push({ pid, qty: 1 }); refreshDraft(true); }); break;
      case 'pkadd': pickAdd(id); break;
      case 'fcat': case 'fbrand': case 'fstatus': case 'fclear': case 'frem': case 'fmore': case 'ftoggle': filterAct(a, el); break;
      case 'saveorder': {
        if (!draft.customer.trim()) { toast('Enter the customer name first'); $('#c-name').focus(); break; }
        const status = el.dataset.s;
        if (status === 'reserved' && shortages(draft.items, draft.id).length) { toast('Some parts are short. Save as quotation instead.'); break; }
        let rec;
        if (draft.id) { rec = S.projects.find(p => p.id === draft.id); Object.assign(rec, { customer: draft.customer.trim(), phone: draft.phone, place: draft.place, kitId: draft.kitId, items: draft.items.map(i => ({ ...i })), labour: Number(draft.labour || 0), status }); }
        else { rec = { id: 'SS-' + (S.seq++), customer: draft.customer.trim(), phone: draft.phone, place: draft.place, kitId: draft.kitId, items: draft.items.map(i => ({ ...i })), labour: Number(draft.labour || 0), status, date: daysAgo(0), returns: [] }; S.projects.push(rec); }
        notify('order', (status === 'reserved' ? 'Stock reserved for ' : 'Quotation saved for ') + rec.customer, rec.id + ' · ' + inr(billed(rec)) + '.', '#orders', LOG);
        save(); draft = null; orderFilter = 'open'; toast(rec.id + ' saved' + (status === 'reserved' ? ', stock reserved' : ' as quotation')); go('orders'); break;
      }
      case 'canceledit': draft = null; go('orders'); break;
      case 'ofilter': orderFilter = id; render(); break;
      case 'editorder': draft = { id: o.id, customer: o.customer, phone: o.phone, place: o.place, kitId: o.kitId, items: o.items.map(i => ({ ...i })), labour: o.labour }; go('new-order'); break;
      case 'vieworder': viewOrder(id); break;
      case 'reserve': o.status = 'reserved'; notify('order', 'Stock reserved for ' + o.customer, o.id + ' · ' + inr(billed(o)) + '. These parts are now held for this customer.', '#orders', LOG); save(); render(); toast('Stock reserved for ' + o.customer); break;
      case 'unreserve': confirmBox('Release reserved stock?', 'The parts held for ' + esc(o.customer) + ' become free again. The order goes back to quotation.', 'Release', () => { o.status = 'quote'; save(); toast('Stock released'); }); break;
      case 'dispatch': confirmBox('Dispatch to ' + (o.place || 'site') + '?', 'These ' + o.items.length + ' parts leave the godown for ' + esc(o.customer) + '. Leftover can be returned later.', 'Dispatch', () => {
        o.items.forEach(i => { part(i.pid).stock -= i.qty; S.moves.push({ date: daysAgo(0), pid: i.pid, qty: -i.qty, type: 'out', ref: o.id + ' ' + o.customer }); });
        notify('dispatch', o.customer + ' system dispatched', o.id + ' · ' + o.items.length + ' parts left the godown for ' + (o.place || 'site') + '.', '#orders', LOG);
        o.status = 'dispatched'; save(); toast(o.id + ' dispatched. Stock updated.');
      }); break;
      case 'return': returnModal(id); break;
      case 'installed': o.status = 'installed'; notify('done', o.customer + ' system installed', o.id + ' · ' + kwOf(o.items).toFixed(2) + ' kWp at ' + (o.place || 'site') + '.', '#orders', LOG); save(); render(); toast(o.customer + ' marked installed'); break;
      case 'copybuy': copy(buyList().map(x => x.p.name + ' (' + x.p.sku + '): ' + qn(x.qty) + ' ' + x.p.unit).join('\n'), 'Purchase list copied'); break;
      case 'exp': exportKind = id; render(); break;
      case 'stockcsv': download('saurasakti-stock-' + stamp() + '.csv', csv([['Brand', 'Part', 'Code', 'Category', 'Unit', 'In godown', 'Reserved', 'Free', 'Buy price', 'Sell price', 'Status']].concat(
        S.parts.filter(p => matchPart(p, stockFilter)).sort(SORTS[stockFilter.sort][1]).map(p => [p.brand, p.name, p.sku, CATS[p.cat], p.unit, p.stock, reserved(p.id), p.stock - reserved(p.id), p.cost, p.price, stateLabel[stockState(p)]])))); break;
      case 'buycsv': download('saurasakti-purchase-list-' + stamp() + '.csv', csv([['Brand', 'Part', 'Code', 'Order qty', 'Unit', 'Approx cost', 'Why']].concat(
        buyList().map(x => [x.p.brand, x.p.name, x.p.sku, x.qty, x.p.unit, x.qty * x.p.cost, x.reasons.join('; ')])))); break;
      case 'expcsv': download('saurasakti-tally-' + (exportKind === 'stock' ? 'closing-stock' : 'dispatched-lines') + '-' + stamp() + '.csv', exportText()); break;
      case 'guide': closeNotif(); guide(); break;
      case 'gguide': closeModal(); go(id); break;
      case 'copyexp': copy($('#export').value, 'Copied. Paste into Excel, then import to Tally.', $('#export')); break;
    }
  }
  const csvCell = v => { const s = String(v == null ? '' : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const csv = rows => rows.map(r => r.map(csvCell).join(',')).join('\r\n');
  function download(name, text) {
    try {
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + text], { type: 'text/csv;charset=utf-8' })); a.download = name;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      toast(name + ' saved to your Downloads folder.', { title: 'Download' });
    } catch (e) { toast('Downloads are not available here. Use Copy instead.', { title: 'Download' }); }
  }
  const stamp = () => daysAgo(0);
  function copy(text, msg, field) {
    const fallback = () => { if (field) { field.focus(); field.select(); toast('Press Ctrl+C to copy the selected text'); } else toast('Copy is blocked here'); };
    try { navigator.clipboard.writeText(text).then(() => toast(msg), fallback); } catch (e) { fallback(); }
  }

  document.addEventListener('click', ev => {
    const el = ev.target.closest('[data-act]');
    if (!el || el.tagName === 'INPUT' || el.tagName === 'SELECT') return;
    if (el.disabled) return;
    act(el, ev);
  });
  document.addEventListener('input', ev => {
    const el = ev.target;
    if (el.id === 'q') { stockFilter.q = el.value; refreshFilter('stock'); return; }
    if (el.id === 'pk-q') { pk.q = el.value; refreshFilter('pk'); return; }
    if (el.id === 'si-find') {
      const t = tokens(el.value), ps = S.parts.filter(p => t.every(x => hay(p).includes(x))), sel = $('#si-part');
      sel.innerHTML = ps.length ? partOptions(ps[0].id, p => ps.includes(p)) : '<option value="">No part matches</option>'; return;
    }
    const a = el.dataset.act;
    if (a === 'dfield') { draft[el.dataset.f] = el.dataset.f === 'labour' ? Math.max(0, +el.value || 0) : el.value; if (el.dataset.f === 'labour') { const v = el.value; refreshDraft(false); const l = $('#labour'); l.focus(); l.value = v; } }
  });
  document.addEventListener('change', ev => {
    const el = ev.target, a = el.dataset.act;
    if (a === 'lqty') { draft.items[+el.dataset.i].qty = Math.max(1, Math.floor(+el.value || 1)); refreshDraft(true); }
    if (a === 'npref') {
      const k = el.dataset.k;
      if (k === 'desktop' && el.checked) { askDesktop().then(ok => { S.prefs.desktop = ok; persist(); renderNotif(); }); return; }
      S.prefs[k] = el.checked; persist(); if (k === 'live') render(); return;
    }
    if (a === 'fsort') { stockFilter.sort = el.value; refreshFilter('stock'); }
    if (a === 'swap') { draft.items[+el.dataset.i].pid = el.value; refreshDraft(true); }
    if (a === 'kitqty') { const k = S.kits.find(x => x.id === el.dataset.k); k.items[+el.dataset.i].qty = Math.max(1, Math.floor(+el.value || 1)); save(); render(); }
  });
  document.addEventListener('keydown', ev => {
    const t = ev.target, typing = /^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName), modalOpen = !!$('#layer').innerHTML;
    if (ev.key === 'Escape' && notifOpen) { closeNotif(); return; }
    if (ev.key === 'Enter' && t.classList && t.classList.contains('ni')) { t.click(); return; }
    if (ev.key === 'Escape' && modalOpen) { closeModal(); return; }
    if (ev.key === '/' && !typing && !modalOpen && route() === 'stock') { ev.preventDefault(); $('#q').focus(); return; }
    if (ev.key === 'Escape' && t.id === 'q') { if (t.value) { stockFilter.q = ''; refreshFilter('stock'); } else t.blur(); return; }
    if (ev.key === 'Enter' && t.id === 'pk-q' && pk) { const first = pickerRows().find(p => !pk.taken(p.id) && !pk.added.includes(p.id)); if (first) { ev.preventDefault(); pickAdd(first.id); } }
  });

  /* ---------- Live notifications ---------- */
  Object.assign(ICON, {
    bell: svgI('<path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 21a2 2 0 0 0 4 0"/>'),
    check: svgI('<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>'),
    gear: svgI('<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>')
  });
  const NT = { out: ['bad', 'alert'], low: ['warn', 'alert'], order: ['info', 'orders'], dispatch: ['sun', 'orders'], done: ['ok', 'check'], stock: ['ok', 'stock'], info: ['plain', 'bell'] };
  const PREF_OF = { out: 'low', low: 'low', order: 'order', dispatch: 'order', done: 'order', stock: 'stock' };
  const LOG = { silent: true, force: true };
  const BASE_TITLE = document.title;
  const SEV = { ok: 0, warn: 1, bad: 2 };
  let notifOpen = false, notifTab = 'all', notifView = 'list';

  const unreadCount = () => S.notes.filter(n => !n.read).length;
  const ago = ts => {
    const s = Math.max(0, (Date.now() - ts) / 1000); if (s < 45) return 'just now';
    const m = Math.round(s / 60); if (m < 60) return m + ' min ago';
    const h = Math.round(m / 60); if (h < 24) return h + ' h ago';
    const d = Math.round(h / 24); return d === 1 ? 'Yesterday' : d + ' days ago';
  };
  function chime() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext, c = new AC(), o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
      o.type = 'sine'; o.frequency.setValueAtTime(880, t); o.frequency.exponentialRampToValueAtTime(1320, t + .12);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.12, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .35);
      o.connect(g); g.connect(c.destination); o.start(); o.stop(t + .4);
    } catch (e) { /* sound is optional */ }
  }
  const bellHTML = () => '<button type="button" class="btn bell" id="bell" data-act="nbell" aria-haspopup="dialog" aria-expanded="' + notifOpen + '" aria-label="Notifications, ' + unreadCount() + ' unread">' + ICON.bell +
    '<span class="bdg"' + (unreadCount() ? '' : ' hidden') + '>' + (unreadCount() > 9 ? '9+' : unreadCount()) + '</span></button>';
  function updateBell() {
    const u = unreadCount(), b = $('#bell .bdg'), bell = $('#bell');
    if (b) { b.hidden = !u; b.textContent = u > 9 ? '9+' : u; }
    if (bell) { bell.setAttribute('aria-label', 'Notifications, ' + u + ' unread'); bell.setAttribute('aria-expanded', notifOpen); }
    try { document.title = (u ? '(' + u + ') ' : '') + BASE_TITLE; } catch (e) { /* title is cosmetic */ }
  }
  function ringBell() { const b = $('#bell'); if (b) { b.classList.remove('ring'); void b.offsetWidth; b.classList.add('ring'); } }

  function notify(type, title, text, href, o) {
    o = o || {};
    const k = PREF_OF[type];
    if (!o.force && k && S.prefs[k] === false) return null;
    const n = { id: 'n' + Date.now() + Math.floor(Math.random() * 1e4), ts: Date.now(), type, title, text, href: href || '', read: false };
    S.notes.unshift(n); if (S.notes.length > 50) S.notes.length = 50;
    persist();
    if (!o.silent) {
      if (S.prefs.banner) toast(text, { title, href: n.href, id: n.id, tone: NT[type][0], ms: 5500 });
      if (S.prefs.sound) chime();
      if (S.prefs.desktop && typeof Notification !== 'undefined' && Notification.permission === 'granted') { try { new Notification(title, { body: text }); } catch (e) { /* not allowed here */ } }
      ringBell();
    }
    updateBell(); if (notifOpen) renderNotif();
    return n;
  }
  function scanStock() {
    if (!S.alerted) return;
    S.parts.forEach(p => {
      const st = stockState(p), was = S.alerted[p.id];
      if (was === undefined) { S.alerted[p.id] = st; return; }
      if (st === was) return;
      S.alerted[p.id] = st;
      if (SEV[st] > SEV[was]) notify(st === 'bad' ? 'out' : 'low', p.name + (st === 'bad' ? ' is out of stock' : ' is running low'), qn(Math.max(0, avail(p.id))) + ' ' + p.unit + ' free · minimum ' + qn(p.min) + '. Add it to the purchase list.', '#buy');
    });
  }
  function initState() {
    if (!S.alerted) { S.alerted = {}; S.parts.forEach(p => { S.alerted[p.id] = stockState(p); }); persist(); }
  }

  const noteRow = n => '<div class="ni' + (n.read ? '' : ' unread') + '" role="button" tabindex="0" data-act="nopen" data-id="' + n.id + '"><span class="ico sm ' + NT[n.type][0] + '">' + ICON[NT[n.type][1]] + '</span>' +
    '<div class="grow"><div class="nt">' + esc(n.title) + '</div><div class="nx">' + esc(n.text) + '</div></div><span class="nm">' + ago(n.ts) + '</span></div>';
  function renderNotif() {
    const box = $('#notif'), old = $('#notif .nlist'), top = old ? old.scrollTop : 0;
    if (!notifOpen) { box.innerHTML = ''; return; }
    const u = unreadCount(), p = S.prefs;
    let body, head;
    if (notifView === 'settings') {
      const row = (k, label, hint) => '<label class="nrow"><span><b>' + label + '</b><small>' + hint + '</small></span><span class="sw"><input type="checkbox" data-act="npref" data-k="' + k + '"' + (p[k] ? ' checked' : '') + '><span></span></span></label>';
      head = '<button type="button" class="btn ghost sm" data-act="nback">‹ Back</button><b>Settings</b><span class="np-sp"></span>';
      body = '<div class="nlist">' + row('low', 'Low and out-of-stock alerts', 'When a part drops below its minimum') + row('order', 'Order updates', 'Quotations, reservations, dispatch and installation') +
        row('stock', 'Godown stock movements', 'Stock received or corrected') + row('banner', 'Show banners', 'A pop-up in the corner for each new alert') +
        row('desktop', 'Desktop notifications', 'Alerts even when this tab is in the background') + row('sound', 'Play a sound', 'A soft chime for each new alert') +
        row('live', 'Simulate live activity', 'Demo only: other staff update stock and orders every few seconds') + '</div>' +
        '<div class="nfoot btns"><button type="button" class="btn sm" data-act="ntest">Send a test notification</button><button type="button" class="btn sm" data-act="guide">Demo guide</button><button type="button" class="btn sm" data-act="reset">Reset sample data</button></div>';
    } else {
      const list = notifTab === 'unread' ? S.notes.filter(n => !n.read) : S.notes, d0 = new Date(); d0.setHours(0, 0, 0, 0);
      const grp = (label, items) => items.length ? '<div class="ngrp">' + label + '</div>' + items.map(noteRow).join('') : '';
      head = '<b>Notifications</b><span class="np-t"><button type="button" class="btn ghost sm" data-act="nread"' + (u ? '' : ' disabled') + '>Mark all read</button>' +
        '<button type="button" class="btn ghost sm" data-act="nclear"' + (S.notes.length ? '' : ' disabled') + '>Clear</button><button type="button" class="btn ghost sm" data-act="nset" aria-label="Notification settings">' + ICON.gear + '</button></span>';
      body = '<div class="nseg"><div class="chips seg"><button type="button" class="chip' + (notifTab === 'all' ? ' on' : '') + '" data-act="ntab" data-id="all">All</button>' +
        '<button type="button" class="chip' + (notifTab === 'unread' ? ' on' : '') + '" data-act="ntab" data-id="unread">Unread' + (u ? ' <span class="cnt">' + u + '</span>' : '') + '</button></div></div>' +
        '<div class="nlist">' + (list.length ? grp('Today', list.filter(n => n.ts >= d0)) + grp('Earlier', list.filter(n => n.ts < d0)) : '<div class="empty">' + (notifTab === 'unread' ? 'You are all caught up.' : 'No notifications yet.') + '</div>') + '</div>';
    }
    box.innerHTML = '<div class="np" role="dialog" aria-label="Notifications"><div class="np-h">' + head + '</div>' + body + '</div>';
    const nl = $('#notif .nlist'); if (nl) nl.scrollTop = top;
  }
  function closeNotif() { if (!notifOpen) return; notifOpen = false; renderNotif(); updateBell(); }
  async function askDesktop() {
    try {
      if (typeof Notification === 'undefined') throw new Error('unsupported');
      const perm = Notification.permission === 'granted' ? 'granted' : await Notification.requestPermission();
      if (perm === 'granted') return true;
    } catch (e) { /* fall through to the hint below */ }
    toast('Desktop notifications are blocked in this preview. They work in the full app.', { title: 'Notifications' });
    return false;
  }
  function notifAct(a, el) {
    const id = el.dataset.id;
    if (a === 'nbell') { notifOpen = !notifOpen; notifView = 'list'; renderNotif(); updateBell(); return; }
    if (a === 'nread') S.notes.forEach(n => { n.read = true; });
    if (a === 'nclear') S.notes = [];
    if (a === 'nset') notifView = 'settings';
    if (a === 'nback') notifView = 'list';
    if (a === 'ntab') notifTab = id;
    if (a === 'ntest') notify('info', 'Test notification', 'This is how live alerts will appear.', '', {});
    if (a === 'nopen') { const n = S.notes.find(x => x.id === id); if (n) { n.read = true; persist(); closeNotif(); if (n.href) go(n.href.slice(1)); } }
    persist(); updateBell(); renderNotif();
  }

  /* Simulated activity from other staff, so the demo shows live behaviour */
  function liveQuote(name, place, kitId, by) {
    const k = S.kits.find(x => x.id === kitId); if (!k) return null;
    const o = { id: 'SS-' + (S.seq++), customer: name, phone: '', place, kitId, items: k.items.map(i => ({ ...i })), labour: 15000, status: 'quote', date: daysAgo(0), returns: [] };
    S.projects.push(o);
    return ['order', 'New quotation from ' + name, by + ' created ' + o.id + ' for a ' + kwOf(o.items).toFixed(1) + ' kWp system, ' + inr(billed(o)) + '.', '#orders'];
  }
  const LIVE = [
    () => { const p = part('p30'); if (!p) return null; p.stock += 12; S.moves.push({ date: daysAgo(0), pid: p.id, qty: 12, type: 'in', ref: 'Amaron distributor, Inv AM-5521' }); return ['stock', 'Godown received 12 × ' + p.name, 'Added by the store keeper. ' + qn(avail(p.id)) + ' ' + p.unit + ' now free.', '#stock']; },
    () => liveQuote('Meena Das', 'Chandrasekharpur, Bhubaneswar', 'k1', 'Sales team'),
    () => { const o = S.projects.find(x => x.id === 'SS-1042' && x.status === 'quote'); return o ? ['order', o.customer + ' approved the quotation', o.id + ' for ' + inr(billed(o)) + '. Reserve stock to hold the parts.', '#orders'] : null; },
    () => { const p = part('p28'); if (!p || p.stock < 2) return null; p.stock -= 2; S.moves.push({ date: daysAgo(0), pid: p.id, qty: -2, type: 'adjust', ref: 'Damaged in transit' }); return ['stock', 'Stock corrected: ' + p.name, '2 pcs written off as damaged in transit.', '#stock']; },
    () => { const o = S.projects.find(x => x.id === 'SS-1039' && x.status === 'dispatched'); if (!o) return null; o.status = 'installed'; return ['done', o.customer + ' system installed', o.id + ' · ' + kwOf(o.items).toFixed(2) + ' kWp at ' + o.place + '. Site team marked it complete.', '#orders']; },
    () => liveQuote('Anil Kumar Dash', 'Rourkela', 'k4', 'Sales team'),
    () => ['info', 'Supplier update', 'Loom Solar confirmed delivery of 20 panels by tomorrow evening.', '#buy']
  ];
  function liveRefresh() {
    const t = document.activeElement;
    if ($('#layer').innerHTML || route() === 'new-order' || (t && /^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName))) return;
    render();
  }
  function runLive() {
    while ((S.liveIx || 0) < LIVE.length) {
      const ev = LIVE[S.liveIx++]();
      if (ev) { notify(ev[0], ev[1], ev[2], ev[3]); save(); liveRefresh(); return; }
    }
  }
  const FAST = /[?&]live=fast/.test(location.search);
  if (!navigator.webdriver || FAST) {
    setTimeout(function tick() { if (S.prefs.live && !document.hidden) runLive(); setTimeout(tick, FAST ? 2000 : 26000 + Math.random() * 14000); }, FAST ? 1500 : 14000);
  }
  setInterval(() => { if (notifOpen && notifView === 'list') renderNotif(); }, 30000);

  function guide() {
    const items = [
      ['stock', 'Find any part', 'Type a brand or part name, or use the Brand and Category filters.'],
      ['kits', 'See what you can build', 'Each kit shows how many complete systems the godown can make, and what is holding it back.'],
      ['new-order', 'Make an order', 'Pick a kit, swap a brand, add a part, then reserve the stock.'],
      ['orders', 'Follow an order', 'Dispatch it, return leftover cable, mark it installed.'],
      ['buy', 'Buy what is missing', 'The purchase list works itself out. Copy it or download it as a CSV file.'],
      ['reports', 'Read the insights', 'Hover over the charts, see how long stock will last, export for Tally.'],
      ['home', 'Watch live alerts', 'Use the bell. New activity arrives every half minute, and low stock raises an alert by itself.']
    ];
    modal('Welcome to Saurasakti Stock Manager',
      '<p>This is a working demo with sample data. Click anything you like. Your changes stay in this browser only, and "Reset sample data" (bottom of the sidebar, or the bell settings on a phone) puts everything back.</p>' +
      '<div class="glist">' + items.map((it, i) => '<button type="button" class="gitem" data-act="gguide" data-id="' + it[0] + '"><span class="gn">' + (i + 1) + '</span><span><b>' + it[1] + '</b><small>' + it[2] + '</small></span></button>').join('') + '</div>',
      [{ label: 'Start exploring', cls: 'primary', fn: closeModal }], true);
  }
  function render() {
    const r = route(); tipEl.hidden = true;
    let grp = '';
    $('#nav').innerHTML = ROUTES.map(([k, label, ic, g]) => (g && g !== grp ? (grp = g, '<div class="grp">' + g + '</div>') : '') +
      '<a href="#' + k + '" class="' + (k === r ? 'on' : '') + (k === 'new-order' ? ' cta' : '') + '"' + (k === r ? ' aria-current="page"' : '') + (k === 'new-order' ? ' data-act="usekit" data-id="k1"' : '') + '>' + ICON[ic] + '<span>' + label + '</span></a>').join('');
    $('#view').innerHTML = V[r]();
    const hd = $('#view .head');
    if (hd) { const tools = document.createElement('div'); tools.className = 'tools'; [...hd.children].slice(1).forEach(x => tools.appendChild(x)); tools.insertAdjacentHTML('beforeend', bellHTML()); hd.appendChild(tools); }
    $('#bar').replaceChildren(...(hd ? [hd] : []));
    const lv = $('#live'); lv.className = 'live' + (S.prefs.live ? '' : ' off'); lv.textContent = S.prefs.live ? 'Live' : 'Live paused';
    updateBell();
  }
  document.addEventListener('click', ev => { if (notifOpen && !ev.composedPath().some(x => x.id === 'notif' || x.id === 'bell')) closeNotif(); });
  window.addEventListener('hashchange', () => { closeModal(); closeNotif(); render(); window.scrollTo(0, 0); });
  initState();
  render();
  try {
    const forced = /[?&]guide/.test(location.search);
    if (forced || (!navigator.webdriver && !localStorage.getItem('saurasakti-guided'))) { localStorage.setItem('saurasakti-guided', '1'); setTimeout(guide, 500); }
  } catch (e) { /* no storage: skip the first-visit guide */ }
})();
</script>
